apiVersion: apps/v1
kind: Deployment
metadata:
  name: cca-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cca-frontend
  template:
    metadata:
      labels:
        app: cca-frontend
    spec:
      imagePullSecrets:
        - name: ecr-registry-secret
      containers:
        - name: cca-frontend
          image: __IMAGE__
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
